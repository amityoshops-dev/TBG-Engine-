# Field extraction and timestamp configuration for TBG/CMS structured JSON logs.
# Place in $SPLUNK_HOME/etc/apps/tbg_engine/local/props.conf

[tbg_core_json]
KV_MODE = json
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
category = Structured
description = TBG/CMS core engine structured JSON event log (payouts, liens, EOD, signature failures)
pulldown_type = true

# Route ingested source to this sourcetype, e.g. via inputs.conf:
#   [monitor:///var/log/tbg-engine/*.log]
#   sourcetype = tbg_core_json
#   index = tbg_core
