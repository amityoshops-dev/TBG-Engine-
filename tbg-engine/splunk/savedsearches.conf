# Preconfigured SPL searches for TBG/CMS engine observability.
# Place in $SPLUNK_HOME/etc/apps/tbg_engine/local/savedsearches.conf
# Adjust index=tbg_core / sourcetype=tbg_core_json to match your inputs.conf.

[TBG - End-to-End Transaction Trace]
search = index=tbg_core sourcetype=tbg_core_json correlation_id="$correlation_id$" \
| table _time, event_type, status, account_id, txnid, amount, latency_ms, error_message \
| sort _time
description = Trace a single transaction across ingestion, lien, ledger posting, and settlement by correlation_id.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[TBG - Payout Failure Rate (5m buckets)]
search = index=tbg_core sourcetype=tbg_core_json event_type="LEDGER_POSTING" OR event_type="LIEN_REJECTED" OR event_type="LEDGER_POSTING_FAILED" \
| stats count(eval(status="FAILED")) as failed_txns, count as total_txns by _time span=5m \
| eval failure_rate = round((failed_txns / total_txns) * 100, 2) \
| where failure_rate > 5 AND total_txns > 10
description = Alert-ready search flagging elevated payout failure rates (>5%) with meaningful volume.
dispatch.earliest_time = -1h
dispatch.latest_time = now
alert.severity = 3
alert.suppress = 0
cron_schedule = */5 * * * *
enableSched = 0

[TBG - Unbalanced Ledger Reconciliation Exception]
search = index=tbg_core sourcetype=tbg_core_json event_type="LEDGER_POSTING" \
| stats sum(eval(if(status="SETTLED", amount, 0))) as settled_amount by txnid \
| join type=left txnid [ search index=tbg_core sourcetype=tbg_core_json event_type="EOD_BALANCED" | stats sum(amount) as eod_amount by txnid ] \
| where isnull(eod_amount) AND settled_amount > 0
description = Flags settled transactions with no matching EOD balancing entry — a reconciliation break candidate.
dispatch.earliest_time = -24h
dispatch.latest_time = now

[TBG - SLA Latency Breach (p99 > 500ms)]
search = index=tbg_core sourcetype=tbg_core_json event_type="LEDGER_POSTING" \
| stats perc99(latency_ms) as p99_latency by _time span=5m \
| where p99_latency > 500
description = Alerts when p99 payout latency exceeds the 500ms SLA over a rolling 5-minute window.
dispatch.earliest_time = -1h
dispatch.latest_time = now
alert.severity = 4
cron_schedule = */5 * * * *
enableSched = 0

[TBG - EOD Suspense Zero-Out Verification]
search = index=tbg_core sourcetype=tbg_core_json event_type="EOD_BALANCED" OR event_type="EOD_BALANCING_FAILED" OR event_type="EOD_NOOP" \
| table _time, event_type, account_id, amount, status, error_message \
| sort -_time
description = Daily audit trail of the midnight EOD suspense zero-out run; EOD_BALANCING_FAILED should never appear in a healthy system.
dispatch.earliest_time = -7d
dispatch.latest_time = now
